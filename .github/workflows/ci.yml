name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: CLI package smoke test
        run: ./scripts/cli-package-smoke.sh

      - name: Test
        run: pnpm run test:unit

      - name: Setup Solana CLI
        if: matrix.node-version == '20.x'
        uses: ./.github/actions/setup-solana

      - name: Test Integration
        if: matrix.node-version == '20.x'
        run: pnpm run test:integration

  # A release PR is one that bumps package versions. `changeset version` also
  # deletes the changesets it consumed, and publish-packages.yml refuses to
  # publish while any remain — silently, since a skipped job reports green.
  # Catch that here, on the PR, rather than after the merge. Deliberately a
  # separate job with no pnpm install: it answers in seconds instead of queuing
  # behind the build and the integration suite.
  #
  # Scoped to main-targeted PRs so it mirrors publish-packages.yml, which only
  # runs on pushes to main. A develop-targeted version bump cannot trigger a
  # publish, so it has no leftover-changeset hazard to guard against.
  release-consistency:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs first, so a guard that has stopped guarding is reported as a broken
      # guard rather than as a passing check.
      - name: Test the release-consistency check
        run: ./scripts/__tests__/check-release-consistency.test.sh

      - name: Check release consistency
        run: ./scripts/check-release-consistency.sh "${{ github.event.pull_request.base.sha }}"
